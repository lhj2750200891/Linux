%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/gd,gpio-leds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GD32F10x GPIO LED

maintainers:
  - lhj <houjun.li>

description: |
  LED 容器节点, 驱动 drivers/led/ 消费 (led_set / led_toggle)。
  子节点 = LED 实例, 个数与顺序由 count/子节点声明决定;
  按名字访问用生成宏 DT_<名>_IDX, 例 led_set(DT_LED1_IDX, 1)。

properties:
  compatible:
    const: gd,gpio-leds

  count:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 实例个数, 必须与子节点数一致 (脚本校验)。

  status:
    enum: [okay, disabled]
    description: disabled 时只生成 COUNT 0, 驱动不初始化 (API 为空实现)。

patternProperties:
  "^led[0-9a-z_-]+$":
    type: object
    properties:
      gpios:
        maxItems: 1
        description: 单元格式 <&gpio端口 引脚号 模式>, 模式取
          dt-bindings/gpio/gd32f10x-gpio.h (输出用 GD32_MODE_OUT_PP/OUT_OD)。

      init-level:
        enum: [0, 1]
        default: 0
        description: 上电初始电平 (GD32_LEVEL_LOW/HIGH)。

    required:
      - gpios
    additionalProperties: false

required:
  - compatible
  - count

additionalProperties: false

examples:
  - |
    leds {
        compatible = "gd,gpio-leds";
        status = "okay";
        count = <2>;

        led1 { gpios = <&gpioc 13 GD32_MODE_OUT_PP>; init-level = <GD32_LEVEL_HIGH>; };
        led2 { gpios = <&gpioc 9  GD32_MODE_OUT_PP>; init-level = <GD32_LEVEL_HIGH>; };
    };
...
